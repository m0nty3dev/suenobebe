name: suenobebe
description: "Sueño Bebé - Registro visual de sueño y alimentación de tu bebé."
publish_to: 'none'
version: 1.0.9+10

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management & navigation
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.3

  # Firebase
  firebase_core: ^3.13.1
  firebase_auth: ^5.5.4
  cloud_firestore: ^5.6.6
  cloud_functions: ^5.3.5
  firebase_messaging: ^15.2.5
  firebase_analytics: ^11.4.5
  firebase_crashlytics: ^4.3.5
  firebase_storage: ^12.4.5

  # Auth
  google_sign_in: ^6.2.2

  # Payments & Ads
  in_app_purchase: ^3.2.1
  google_mobile_ads: ^5.3.0
  # UMP consent se integra via google_mobile_ads SDK nativo (no requiere paquete separado en pub.dev)

  # Localization & dates
  intl: ^0.20.2
  timezone: ^0.9.4
  flutter_local_notifications: ^18.0.1

  # UI
  table_calendar: ^3.1.2
  fl_chart: ^0.69.0
  phosphor_flutter: ^2.1.0

  # Data models
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  collection: ^1.18.0

  # Fonts
  google_fonts: ^6.2.1

  # Utils
  shared_preferences: ^2.3.5
  path_provider: ^2.1.5
  url_launcher: ^6.3.1
  image_picker: ^1.1.2
  uuid: ^4.5.1
  rxdart: ^0.28.0
  package_info_plus: ^8.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.14
  freezed: ^2.5.7
  json_serializable: ^6.9.3
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/

  # fonts:
  #   Add Inter font TTF files to assets/fonts/ to enable:
  #   - asset: assets/fonts/Inter-Regular.ttf
  #   - asset: assets/fonts/Inter-Medium.ttf (weight: 500)
  #   - asset: assets/fonts/Inter-SemiBold.ttf (weight: 600)
  #   - asset: assets/fonts/Inter-Bold.ttf (weight: 700)
